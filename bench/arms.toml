# Benchmark arms (docs/bench/README.md). Every arm uses the same Claude account: the OAuth access token is read
# at run time from $BENCH_CC_CREDENTIALS (bench/arms/oauth-token.sh) and never written anywhere.
# Model and effort are fixed per round by `bench run --model`; thinking/effort below is the arm default.

[cc-vanilla]
bin = "arms/claude-vanilla"
runner = "run.py"            # ~/.claude/evals/run.py --claude-bin
version = "claude-code 2.1.323"
effort = "medium"
profile = "isolated CLAUDE_CONFIG_DIR, auto permission mode, autoupdater off"

[pi-vanilla]
bin = "arms/pi-vanilla"
runner = "run_pi.py"         # PELO_PI_BIN
version = "pi 1.5.2"
effort = "medium"            # --thinking medium
profile = "empty PI_CODING_AGENT_DIR (no packages/extensions/skills); eval-only flags dropped"

# The measured product (09 §2.2): the nycode monorepo built from this checkout, no installer, no patches.
[nycode]
bin = "arms/nycode"
runner = "run_pi.py"
version = "nycode (this checkout)"
effort = "settings.json"     # from the owner layer (overlay-nycode.list)
profile = "throwaway HOME, NYCODE_CODING_AGENT_DIR in the stage; npm ci --ignore-scripts + npm run build; layer hash in .overlay-sha"
stage_prefix = "bench-nycode"

# A/B variants of the measured product (docs/harness/plano-todo-sync-codemode-2026-11-25.md): same stage and build,
# only the env differs (bench/metrics/README.md). Headless runs drop the `todo` tool (headless-lean, item 8), so the
# todo pair keeps it with NYCODE_HEADLESS_TRIM=0 in both arms: compare nycode-todo-v2 against nycode-todo-v1.
[nycode-todo-v1]
bin = "arms/nycode"
runner = "run_pi.py"
version = "nycode (this checkout)"
effort = "settings.json"
profile = "arm nycode with NYCODE_HEADLESS_TRIM=0 (keeps the todo tool headless; control for nycode-todo-v2)"
stage_prefix = "bench-nycode"
env = { NYCODE_HEADLESS_TRIM = "0" }

[nycode-todo-v2]
bin = "arms/nycode"
runner = "run_pi.py"
version = "nycode (this checkout)"
effort = "settings.json"
profile = "arm nycode-todo-v1 plus NYCODE_TODO_SYNC_V2=1 (todo.sync: turn-end check, external items, new reminder cadence)"
stage_prefix = "bench-nycode"
env = { NYCODE_HEADLESS_TRIM = "0", NYCODE_TODO_SYNC_V2 = "1" }

[nycode-mcp-hybrid]
bin = "arms/nycode"
runner = "run_pi.py"
version = "nycode (this checkout)"
effort = "settings.json"
profile = "arm nycode with NYCODE_MCP_TOOL_SEARCH=1 (MCP autoEnableToolSearch: tool_search next to codemode)"
stage_prefix = "bench-nycode"
env = { NYCODE_MCP_TOOL_SEARCH = "1" }
