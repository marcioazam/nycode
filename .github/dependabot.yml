version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Fixed labels: without them Dependabot creates ecosystem labels (`javascript`) outside the label set (R36).
    labels: ["dependencies", "github_actions"]
    groups:
      github-actions:
        patterns: ["*"]
  # Workspaces (packages/*, apps/*) resolve from the root package-lock.json.
  # packages/coding-agent/install-lock/ is generated from it; do not target it.
  # Group only minor/patch version updates and ignore major version bumps: breaking majors
  # (provider SDKs, test runners, Node types) arrive via upstream syncs so the fork does not
  # diverge on upstream adapters. Security updates are unaffected by version-update ignore rules.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
